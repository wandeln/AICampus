<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;font-size:12px;line-height:1.4}
.app{padding:4px 6px}
.header{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.header h1{font-size:13px;font-weight:700;color:#0f172a}
.formula-row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
.chart-wrap{position:relative;width:100%;height:240px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.ctl{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:4px;padding:3px 6px}
.ctl label{font-size:10px;font-weight:600;color:#475569;white-space:nowrap}
.ctl select{font-size:11px;padding:2px 4px;border:1px solid #cbd5e1;border-radius:3px;background:#fff;max-width:100px}
.ctl input[type=range]{width:60px;-webkit-appearance:none;appearance:none;height:4px;background:#e2e8f0;border-radius:2px;outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#3b82f6;border-radius:50%;cursor:pointer}
.ctl .val{font-size:10px;color:#3b82f6;font-weight:600;min-width:28px;text-align:right}
.btn{padding:3px 10px;border:none;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-s{background:#e2e8f0;color:#334155}.btn-s:hover{background:#cbd5e1}
.btn-d{background:#fee2e2;color:#dc2626}.btn-d:hover{background:#fecaca}
.btn:disabled{opacity:.5;cursor:not-allowed}
.info{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:11px;align-items:center}
.info .il{color:#64748b;font-size:10px}
.info .iv{font-weight:600;color:#0f172a;font-family:'Courier New',monospace;font-size:11px}
.status{font-size:10px;padding:2px 6px;border-radius:3px;display:none}
.status.converged{display:inline;background:#dcfce7;color:#166534}
.status.diverged{display:inline;background:#fee2e2;color:#991b1b}
.status.oscillating{display:inline;background:#fef3c7;color:#92400e}
@media(max-width:400px){.chart-wrap{height:180px}.ctl input[type=range]{width:44px}}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>Gradientenabstieg 1D</h1><span id="gd-formula" style="font-size:13px;color:#475569;align-self:center"></span>
</div>
<div class="formula-row">
<div class="ctl"><label>f(x)=</label><select id="sel-func"><option value="0">x²</option><option value="1">x⁴−4x²</option><option value="2">sin(x)+x/2</option><option value="3">x³−3x</option></select></div>
<span id="deriv-display" style="font-size:12px;color:#475569;align-self:center"></span>
</div>
<div class="chart-wrap"><canvas id="chart"></canvas></div>
<div class="controls">
<div class="ctl"><label>α (log)</label><input type="range" id="sl-alpha" min="-3" max="1" step="0.01" value="-1"><span class="val" id="val-alpha">0.10</span></div>
<div class="ctl"><label>x₀</label><input type="range" id="sl-x0" min="-5" max="5" step="0.1" value="3.0"><span class="val" id="val-x0">3.0</span></div>
<div class="ctl"><label>Schritte</label><input type="range" id="sl-steps" min="5" max="100" step="1" value="30"><span class="val" id="val-steps">30</span></div>
<button class="btn btn-p" id="btn-anim">▶</button>
<button class="btn btn-s" id="btn-step">→</button>
<button class="btn btn-d" id="btn-reset">↺</button>
</div>
<div class="info">
<span><span class="il">n=</span><span class="iv" id="info-n">0</span></span>
<span><span class="il">x=</span><span class="iv" id="info-x">3.000</span></span>
<span><span class="il">f(x)=</span><span class="iv" id="info-fx">9.000</span></span>
<span><span class="il">f′(x)=</span><span class="iv" id="info-fpx">6.000</span></span>
<span><span class="il">α·f′=</span><span class="iv" id="info-step">0.600</span></span>
<span class="status" id="status"></span>
</div>
</div>
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script>
(function(){
var funcs=[
{name:"x²",f:function(x){return x*x},fp:function(x){return 2*x}},
{name:"x⁴−4x²",f:function(x){return x*x*x*x-4*x*x},fp:function(x){return 4*x*x*x-8*x}},
{name:"sin(x)+x/2",f:function(x){return Math.sin(x)+x/2},fp:function(x){return Math.cos(x)+0.5}},
{name:"x³−3x",f:function(x){return x*x*x-3*x},fp:function(x){return 3*x*x-3}}
];
var funcIdx=0,alpha=0.1,x0=3.0,maxSteps=30;
var points=[],currentStep=0,animating=false,animId=null,chart=null;
function getFunc(){return funcs[funcIdx]}
var derivLaTeX=["2x","4x^3-8x","\\cos(x)+\\frac{1}{2}","3x^2-3"];
function updateDerivDisplay(){var el=document.getElementById('deriv-display');if(el){katex.render("f'(x)="+derivLaTeX[funcIdx],el,{throwOnError:false});}}
function buildChartData(){
var fn=getFunc();var xs=[],ys=[];
for(var i=-6;i<=6.01;i+=0.05){xs.push(i);ys.push(fn.f(i));}
var lineData=xs.map(function(v,i){return{x:v,y:ys[i]}});
var pathData=points.map(function(p){return{x:p.x,y:p.y}});
var scatterData=points.map(function(p){return{x:p.x,y:p.y}});
return{lineData:lineData,pathData:pathData,scatterData:scatterData};
}
function initChart(){
var ctx=document.getElementById('chart').getContext('2d');
var cd=buildChartData();
chart=new Chart(ctx,{type:'line',data:{datasets:[
{label:'f(x)',data:cd.lineData,borderColor:'#3b82f6',borderWidth:2,pointRadius:0,fill:false,tension:0.1,order:3},
{label:'GD-Pfad',data:cd.pathData,borderColor:'#ef4444',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,tension:0,order:2},
{label:'Punkte',data:cd.scatterData,type:'scatter',backgroundColor:'#ef4444',pointRadius:3,pointHoverRadius:5,order:1}
]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
scales:{x:{type:'linear',title:{display:true,text:'x',font:{size:10}},grid:{color:'#f1f5f9'},ticks:{font:{size:9}}},
y:{title:{display:true,text:'f(x)',font:{size:10}},grid:{color:'#f1f5f9'},ticks:{font:{size:9}}}},
plugins:{legend:{position:'top',labels:{usePointStyle:true,font:{size:10},boxWidth:8,padding:6}},
tooltip:{callbacks:{label:function(c){return c.dataset.label+': ('+c.parsed.x.toFixed(2)+', '+c.parsed.y.toFixed(2)+')'}}}}}});
}
function updateChart(){if(!chart)return;var cd=buildChartData();chart.data.datasets[0].data=cd.lineData;chart.data.datasets[1].data=cd.pathData;chart.data.datasets[2].data=cd.scatterData;chart.update('none');}
function updateInfo(){
var fn=getFunc();var x=points.length>0?points[points.length-1].x:x0;
var fx=fn.f(x),fpx=fn.fp(x);
document.getElementById('info-n').textContent=currentStep;
document.getElementById('info-x').textContent=x.toFixed(3);
document.getElementById('info-fx').textContent=fx.toFixed(3);
document.getElementById('info-fpx').textContent=fpx.toFixed(3);
document.getElementById('info-step').textContent=(alpha*fpx).toFixed(3);
var st=document.getElementById('status');st.className='status';st.style.display='none';
if(currentStep>=maxSteps){
if(Math.abs(fpx)<0.01){st.className='status converged';st.textContent='✓ konvergiert';}
else if(Math.abs(x)>100){st.className='status diverged';st.textContent='✗ divergiert';}
else{st.className='status oscillating';st.textContent='⚠ keine Konvergenz';}
st.style.display='inline';
}
}
function reset(){stopAnim();points=[{x:x0,y:getFunc().f(x0)}];currentStep=0;updateChart();updateInfo();}
function stepOnce(){if(currentStep>=maxSteps)return;var fn=getFunc();var x=points[points.length-1].x;var nx=x-alpha*fn.fp(x);if(!isFinite(nx)||Math.abs(nx)>1e6){nx=nx>0?1e6:-1e6;}points.push({x:nx,y:fn.f(nx)});currentStep++;updateChart();updateInfo();if(currentStep>=maxSteps)stopAnim();}
function startAnim(){if(animating)return;if(currentStep>=maxSteps)reset();animating=true;document.getElementById('btn-anim').textContent='⏸';function tick(){if(!animating)return;stepOnce();if(animating)animId=requestAnimationFrame(tick);}animId=requestAnimationFrame(tick);}
function stopAnim(){animating=false;if(animId)cancelAnimationFrame(animId);animId=null;document.getElementById('btn-anim').textContent='▶';}
function toggleAnim(){if(animating)stopAnim();else startAnim();}
document.getElementById('sel-func').addEventListener('change',function(){funcIdx=parseInt(this.value);updateDerivDisplay();reset();});
document.getElementById('sl-alpha').addEventListener('input',function(){alpha=Math.pow(10,parseFloat(this.value));document.getElementById('val-alpha').textContent=alpha<0.01?alpha.toFixed(4):alpha.toFixed(2);reset();});
document.getElementById('sl-x0').addEventListener('input',function(){x0=parseFloat(this.value);document.getElementById('val-x0').textContent=x0.toFixed(1);reset();});
document.getElementById('sl-steps').addEventListener('input',function(){maxSteps=parseInt(this.value);document.getElementById('val-steps').textContent=maxSteps;reset();});
document.getElementById('btn-anim').addEventListener('click',toggleAnim);
document.getElementById('btn-step').addEventListener('click',stepOnce);
document.getElementById('btn-reset').addEventListener('click',reset);
initChart();updateDerivDisplay();katex.render("x_{n+1} = x_n - \\alpha \\cdot f'(x_n)",document.getElementById('gd-formula'),{throwOnError:false});reset();
})();
</script>
</body>
</html>
