# ────────────────────────────────────────────────────────────────────
# AICampus — nginx-Produktivtemplate (TLS-Terminierung vor dem
# AICampus-Docker-Container auf 127.0.0.1:8000)
#
# Einrichten:
#   1) DOMAIN durch die eigene Domain ersetzen
#      (z. B. aicampus.uni.example.edu)
#   2) REPO_PATH durch den Pfad zum AICampus-Repo AUF DEM HOST ersetzen
#      (das Verzeichnis, in dem static/ und data/ liegen)
#   3) Site aktivieren + Zertifikat via certbot —
#      vollständige Anleitung: docs/installation.md (Abschnitt 3)
#
# nginx übernimmt hier mehr als nur TLS:
#   - /static/  : direkt von nginx (performanter als uvicorn); die App
#                 hängt ?v=<content-hash> an → 1-Jahre-Cache ist sicher
#   - /media/ + /avatars/ : direkt von nginx (UUID-Dateinamen) —
#                 umgeht den Python/DB-Weg, sonst fluten Bild-Requests
#                 den App-Connection-Pool. „Unsichtbarkeit“ entsteht
#                 über die unguessable UUID-Namen, nicht über
#                 nginx-Auth. Applets (.html) bleiben bei der App
#                 (Auto-Size-Boilerplate wird serverseitig injiziert).
#   - Preview-Subdomains (*.DOMAIN) für die Workspace-Web-UIs:
#                 KEIN X-Frame-Options (Preview läuft im iframe),
#                 proxy_buffering off + lange Timeouts (SSE/WebSockets).
#                 Erfordert ein Wildcard-Zertifikat (Let's Encrypt nur
#                 via DNS-01-Challenge). Ohne Wildcard (keine
#                 Preview-Subdomains): *.DOMAIN weglassen, normales
#                 HTTP-01-Zertifikat genügt.
# ────────────────────────────────────────────────────────────────────

# ─── HTTP → HTTPS Redirect ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN *.DOMAIN;

    # Let's Encrypt ACME-Challenge für Zertifikatsausstellung
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Reverse Proxy → AICampus (uvicorn im Docker-Container) ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN *.DOMAIN;

    # ── SSL-Zertifikate (werden von certbot erneuert) ──
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # ── SSL-Einstellungen ──
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ──
    # HSTS; bewusst KEIN X-Frame-Options: Preview-Apps laufen in iframes.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;

    # ── Logging ──
    access_log /var/log/nginx/aicampus_access.log;
    error_log  /var/log/nginx/aicampus_error.log;

    # ── Static assets: direkt von nginx ──
    # Die App hängt einen Content-Hash als ?v= an alle Asset-URLs —
    # bei Änderung ändert sich der Hash → Browser holt die neue Version
    # automatisch. 1 Jahr + immutable ist daher sicher.
    location /static/ {
        alias REPO_PATH/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # CORS für Fonts (z. B. KaTeX): Applets laufen in sandboxed Iframes
        # (Origin "null") — Font-Requests ohne Access-Control-Allow-Origin
        # werden vom Browser blockiert, selbst wenn das File vorhanden ist.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Kurs-Medien & Avatare: direkt von nginx (UUID-Dateinamen) ──
    # Revalidierung via ETag (no-cache), damit ersetzte Dateien aktuell
    # werden.
    location ~ ^/media/(\d+)/([A-Za-z0-9._-]+\.(?:png|jpe?g|webp|gif|svg|pdf))$ {
        alias REPO_PATH/data/media/course_$1/$2;
        expires -1;
    }

    location ~ ^/avatars/([A-Za-z0-9._-]+\.(?:png|jpe?g|webp|gif))$ {
        alias REPO_PATH/data/avatars/$1;
        expires -1;
    }

    # ── Proxy nach AICampus (uvicorn) ──
    # 500m: Kurs-Material-Import (Zip-Uploads) — wirkt erst nach `nginx -s reload`
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-Upgrade (Terminal + Preview-Apps wie Jupyter)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preview-Streams (SSE/long-lived HTTP): nicht puffern
        proxy_buffering off;

        # Lange Verbindungen (Training-Logs, Jupyter, noVNC-WS)
        # + LLM-Antworten können lange brauchen
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
